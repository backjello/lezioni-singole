<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Ultime Notizie</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #2f6df6, #ff4f9a);
        }

        .card {
            width: 700px;
            padding: 60px 40px;
            background: #2c2954;
            border-radius: 30px;
            text-align: center;
            color: white;
        }

        .small-title {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 60px;
            opacity: 0.9;
        }

        .headline {
            font-size: 64px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 60px;
        }

        .hashtag {
            font-size: 36px;
            color: #b7c0ff;
            font-weight: 700;
        }

        @media (max-width:768px) {
            .card {
                width: 90%;
                padding: 40px 20px;
            }

            .headline {
                font-size: 40px;
            }

            .small-title {
                font-size: 24px;
            }

            .hashtag {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="small-title">ULTIME NOTIZIE</div>

        <div class="headline">
            GIU' DEL 90% IL<br>
            TRAFFICO A<br>
            HORMUZ CON<br>
            GREGGIO E CO
        </div>

        <div class="hashtag">#TRENDBOT</div>
    </div>

</body>

</html>
